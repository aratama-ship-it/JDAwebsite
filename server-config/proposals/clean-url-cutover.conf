# JDA本体の旧URLを、確定したクリーンURLへ転送する。
# HTTP→HTTPS・www統一は正規host決定後に別途追加する。
RewriteEngine On

RewriteRule ^about_us\.html$ /about/ [R=301,L,NE]
RewriteRule ^access\.html$ /access/ [R=301,L,NE]
RewriteRule ^records\.html$ /records/ [R=301,L,NE]
RewriteRule ^rule\.html$ /rule/ [R=301,L,NE]
RewriteRule ^inquiry\.html$ /contact/ [R=301,L,NE]
RewriteRule ^performer\.html$ /dispatch/ [R=301,L,NE]
RewriteRule ^workshop\.html$ /dispatch/ [R=301,L,NE]
RewriteRule ^about_OTP2\.html$ /otp2/ [R=301,L,NE]

# 旧モックで公開されていた /external/... も新URLへ集約する。
RewriteRule ^external/about(?:/index\.html)?/?$ /about/ [R=301,L,NE]
RewriteRule ^external/access(?:/index\.html)?/?$ /access/ [R=301,L,NE]
RewriteRule ^external/certification(?:/index\.html)?/?$ /certification/ [R=301,L,NE]
RewriteRule ^external/champions(?:/index\.html)?/?$ /champions/ [R=301,L,NE]
RewriteRule ^external/contact(?:/index\.html)?/?$ /contact/ [R=301,L,NE]
RewriteRule ^external/dispatch(?:/index\.html)?/?$ /dispatch/ [R=301,L,NE]
RewriteRule ^external/news(?:/index\.html)?/?$ /news/ [R=301,L,NE]
RewriteRule ^external/otp2(?:/index\.html)?/?$ /otp2/ [R=301,L,NE]
RewriteRule ^external/records(?:/index\.html)?/?$ /records/ [R=301,L,NE]
RewriteRule ^external/rule(?:/index\.html)?/?$ /rule/ [R=301,L,NE]
