# diabolo.jp 正規URL統一の提案（2026-09-06 作成 / 未適用）
#
# このファイルはそのままアップロードしない。承認後に `.htaccess` という名前で
# 公開ルート直下（アカウントルート `/`）へ設置する。誤アップロード防止のため
# 非アクティブな拡張子で保管している（clean-url-cutover.conf と同じ扱い）。
#
# ────────────────────────────────────────────────────────────
# 目的
#   同じページが http/https × www有無 の4通りで開ける状態を、
#   https://diabolo.jp/ の1通りへ 301 で寄せる。
#
# ────────────────────────────────────────────────────────────
# 設計上の制約（2026-09-06 実測）
#
# 1. 正規は「www無し」でなければならない。
#    /AJDC/(wp4_) と /OIDC/(wp3_) の WordPress は siteurl/home が
#    `https://diabolo.jp` にデータベース側で固定されている。
#    もし www へ寄せると、WordPress が bare へ戻し、この .htaccess が
#    www へ送り返して【無限リダイレクト】になり、両大会サイトが停止する。
#
# 2. ホスト名は許可リスト方式で判定する（除外リスト方式にしない）。
#    judgearchive.diabolo.jp の公開フォルダはアカウント直下の
#    `/judgearchive/` にあり、このファイルの影響範囲に入る。
#    test.diabolo.jp（`/test/`）も同じ。
#    「diabolo.jp 以外なら転送」と書くと、これらのサブドメインが
#    本体ドメインへ吸い込まれて壊れる。
#    → 転送するホストを2つだけ明示し、他のホストには一切触れない。
#
# 3. http→https の判定は2つの変数を AND で見る。
#    実測では Apache が TLS を終端しており %{HTTPS} が使える
#    （https://diabolo.jp/AJDC/ がリダイレクト0回で200＝WordPressが
#    HTTPS を正しく認識している）。ロリポップ公式マニュアルの
#    レンタルサーバー版も %{HTTPS} を用いた記述例を載せている。
#    ただし将来 SSL 終端の構成が変わった場合に備え、
#    X-Forwarded-Proto も併せて見る。どちらか一方でも https を示せば
#    転送しないので、構成が変わってもループしない。
#
# ────────────────────────────────────────────────────────────
# 影響を受けないことを確認済みの経路
#   /AJDC/  /OIDC/   … WordPress 側が既に https://diabolo.jp へ自己正規化
#   /TIDC/jp/         … 静的。転送先が変わるだけで内容は不変
#   judgearchive.diabolo.jp … ホスト名が一致しないため対象外
#
# ────────────────────────────────────────────────────────────
# ロールバック
#   このファイルを削除すれば、設置前の状態に完全に戻る
#   （2026-09-03 時点で公開ルートに .htaccess は存在しなかった）。
#   ブラウザに 301 が残る点だけは戻らないため、初回は R=302 で出すこと。
#
# ────────────────────────────────────────────────────────────

<IfModule mod_rewrite.c>
RewriteEngine On

# (1) www.diabolo.jp → https://diabolo.jp
#     http/https どちらから来ても、1回の転送で https の正規URLへ着地させる。
RewriteCond %{HTTP_HOST} ^www\.diabolo\.jp$ [NC]
RewriteRule ^(.*)$ https://diabolo.jp/$1 [R=302,L]

# (2) diabolo.jp の http → https
RewriteCond %{HTTP_HOST} ^diabolo\.jp$ [NC]
RewriteCond %{HTTPS} !=on
RewriteCond %{HTTP:X-Forwarded-Proto} !=https
RewriteRule ^(.*)$ https://diabolo.jp/$1 [R=302,L]
</IfModule>

# 検証が済んだら、上の2つの R=302 を R=301 に変えて再度アップロードする。
# 検証コマンド: python3 scripts/verify_canonical_host.py
